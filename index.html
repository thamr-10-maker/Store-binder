<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Binder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a phone-first work tool. One column, big touch targets, status told by colour + shape. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --surface2:#e9ebe6; --ink:#16201c; --muted:#5d6a64; --line:#d5d9d2;
  --accent:#0d5c4b; --accent-ink:#ffffff; --accent-soft:#dcebe5;
  --ok:#1f7a45; --ok-soft:#dff1e5; --warn:#a15c00; --warn-soft:#fbecd2; --bad:#b3261e; --bad-soft:#fadfdc;
  --font:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111614; --surface:#1a211e; --surface2:#242d29; --ink:#e9eee9; --muted:#9aa8a1; --line:#334039;
    --accent:#4fc3a5; --accent-ink:#06231b; --accent-soft:#1d3a32;
    --ok:#62c98a; --ok-soft:#173524; --warn:#f0b35a; --warn-soft:#3b2c12; --bad:#ff8a80; --bad-soft:#42201d;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111614; --surface:#1a211e; --surface2:#242d29; --ink:#e9eee9; --muted:#9aa8a1; --line:#334039;
  --accent:#4fc3a5; --accent-ink:#06231b; --accent-soft:#1d3a32;
  --ok:#62c98a; --ok-soft:#173524; --warn:#f0b35a; --warn-soft:#3b2c12; --bad:#ff8a80; --bad-soft:#42201d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.5rem;font-weight:700} h2{font-size:1.15rem;font-weight:600} h3{font-size:1rem;font-weight:600}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
#app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:84px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.top .who{flex:1;min-width:0}
.top .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who span{color:var(--muted);font-size:.82rem}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem;min-height:40px}
main{padding:16px;display:flex;flex-direction:column;gap:16px;flex:1}
.banner{padding:10px 14px;border-radius:var(--r);font-size:.9rem;background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:.85rem}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:4px}
.sec span{color:var(--muted);font-size:.85rem}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:600;background:var(--accent);color:var(--accent-ink);min-height:52px}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:8px 12px;min-height:40px;font-size:.9rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.task{display:flex;gap:12px;align-items:center;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-inline-start:6px solid var(--line);border-radius:var(--r);padding:14px;min-height:64px}
.task.done{border-inline-start-color:var(--ok)} .task.late{border-inline-start-color:var(--bad)} .task.due{border-inline-start-color:var(--warn)}
.task b{display:block} .task small{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:start;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.tile .let{font-weight:700;color:var(--accent);font-size:.8rem;letter-spacing:.04em}
.tile b{font-weight:600;line-height:1.25}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi b{display:block;font-size:1.7rem;font-weight:700;line-height:1.1} .kpi span{color:var(--muted);font-size:.8rem}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs div{display:flex;width:100%;max-width:760px}
nav.tabs button{flex:1;border:0;background:none;padding:10px 2px 12px;font-size:.74rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:60px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
/* wizard */
.wiz{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.wiz header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.wiz header .t{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wiz .prog{height:6px;background:var(--surface2)} .wiz .prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.wiz .body{flex:1;overflow:auto;padding:22px 18px;display:flex;flex-direction:column;gap:18px;max-width:760px;width:100%;margin:0 auto}
.wiz .q{font-size:1.55rem;font-weight:600;line-height:1.25;text-wrap:balance}
.wiz .q.long{font-size:1.2rem}
.wiz .hint{color:var(--muted)}
.wiz footer{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);max-width:760px;width:100%;margin:0 auto}
.wiz footer .btn{flex:1}
.big{width:100%;font-size:1.35rem;padding:16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);min-height:64px}
textarea.big{min-height:190px;resize:vertical;line-height:1.4}
.big:focus{border-color:var(--accent);outline:0}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;font-size:1.15rem;font-weight:600;min-height:64px;text-align:center}
.opt.huge{font-size:1.6rem;min-height:120px}
.opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.opt.yes.on{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.no.on{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.85rem;font-weight:600;color:var(--muted)}
.in{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-height:46px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.list>*{padding:12px 14px;border-top:1px solid var(--line)} .list>*:first-child{border-top:0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto}
.pad button{font-size:1.5rem;font-weight:600;min-height:64px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.dots{display:flex;gap:12px;justify-content:center} .dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)} .dots i.on{background:var(--accent);border-color:var(--accent)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.days button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;min-width:64px;text-align:center}
.days button b{display:block;font-size:1.1rem} .days button span{font-size:.72rem;color:var(--muted)}
.days button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .days button.on span{color:var(--accent-ink)}
.pages{display:flex;flex-direction:column;gap:12px}
.pages img{max-width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:90%}
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--bg);width:100%;max-width:760px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:18px;display:flex;flex-direction:column;gap:12px}
.score{font-size:3rem;font-weight:700;line-height:1}
table.t{width:100%;border-collapse:collapse;font-size:.9rem} table.t td,table.t th{padding:8px 6px;border-top:1px solid var(--line);text-align:start;vertical-align:top} table.t th{color:var(--muted);font-weight:600;border-top:0}
.scroll{overflow-x:auto}
[dir="rtl"] .flip{transform:scaleX(-1)}
@media (max-width:400px){.kpis{grid-template-columns:1fr 1fr 1fr}.wiz .q{font-size:1.35rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><main><div class="card"><b>Loading…</b></div></main></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script src="config.js"></script>
<script>

"use strict";
/* ===================== helpers ===================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad2 = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const today = () => ymd(new Date());
const nowHM = () => { const d = new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const ymOf = s => s.slice(0, 7);
const MON = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const DOW_AR = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
const fmtD = s => { if (!s) return ""; const [y, m, d] = s.split("-"); return `${d}.${m}.${y}`; };       // printed on forms
const monthLabel = ym => { const [y, m] = ym.split("-"); return `${MON[+m - 1]} ${y}`; };
const weekStart = s => addDays(s, -parseD(s).getDay());                                                  // Sunday
const weekOfMonth = s => Math.min(5, Math.ceil(+s.slice(8, 10) / 7));
const quarterOf = s => `${s.slice(0, 4)}-Q${Math.floor((+s.slice(5, 7) - 1) / 3) + 1}`;
const rid = () => Math.random().toString(36).slice(2, 10);
const num = v => { const n = parseFloat(String(v ?? "").replace(/,/g, "")); return isFinite(n) ? n : null; };
const money = v => { const n = num(v); return n === null ? String(v ?? "") : n.toLocaleString("en-US", { maximumFractionDigits: 2 }); };
const clone = o => JSON.parse(JSON.stringify(o));
function deepMerge(a, b) {
  for (const k of Object.keys(b)) {
    if (b[k] && typeof b[k] === "object" && !Array.isArray(b[k]) && a[k] && typeof a[k] === "object" && !Array.isArray(a[k])) deepMerge(a[k], b[k]);
    else a[k] = b[k];
  }
  return a;
}

/* ===================== language ===================== */
let LANG = "en";
try { LANG = localStorage.getItem("sb-lang") || "en"; } catch (e) {}
const STR = {
  appName: ["Store Binder", "ملف المتجر"],
  loading: ["Loading…", "جارٍ التحميل…"],
  whoAreYou: ["Who is signing in?", "من يسجّل الدخول؟"],
  enterPin: ["Enter your PIN", "أدخل الرقم السري"],
  firstPin: ["First time? Your PIN is 0000", "أول مرة؟ رقمك السري هو 0000"],
  notZeros: ["Choose a PIN that is not 0000.", "اختر رقماً غير 0000."],
  newPin: ["Now choose your own 4-digit PIN", "اختر رقماً سرياً من 4 أرقام"],
  repeatPin: ["Type it again", "أعد كتابته"],
  pinMismatch: ["The two PINs did not match. Try again.", "الرقمان غير متطابقين. حاول مرة أخرى."],
  wrongPin: ["Wrong PIN. Try again.", "الرقم السري خطأ. حاول مرة أخرى."],
  back: ["Back", "رجوع"], next: ["Next", "التالي"], skip: ["Skip", "تخطي"], save: ["Save", "حفظ"], finish: ["Finish", "إنهاء"],
  cancel: ["Cancel", "إلغاء"], close: ["Close", "إغلاق"], yes: ["Yes", "نعم"], no: ["No", "لا"], na: ["N/A", "لا ينطبق"],
  done: ["Done", "تم"], notDone: ["Not done", "لم يتم"], late: ["Late", "متأخر"], dueBy: ["Due by", "قبل"], open: ["Open", "مفتوح"],
  myTasks: ["My tasks today", "مهامي اليوم"], openTasks: ["Not assigned to anyone", "غير مسندة لأحد"], noTasks: ["Nothing assigned to you today.", "لا توجد مهام مسندة لك اليوم."],
  logSomething: ["Something happened? Log it", "حدث شيء؟ سجّله"], allForms: ["All forms", "كل النماذج"],
  home: ["Home", "الرئيسية"], forms: ["Forms", "النماذج"], records: ["Records", "السجلات"], today: ["Today", "اليوم"], plan: ["Plan", "الخطة"],
  print: ["Print", "طباعة"], more: ["More", "المزيد"], binder: ["Binder check", "فحص الملف"], review: ["Weekly review", "المراجعة الأسبوعية"],
  audit: ["Audit simulator", "محاكي التدقيق"], config: ["Settings", "الإعدادات"], signOut: ["Sign out", "تسجيل الخروج"],
  viewAs: ["View as a team member", "العرض كأحد أعضاء الفريق"], backToMe: ["Back to my view", "العودة إلى حسابي"],
  saved: ["Saved", "تم الحفظ"], typeHere: ["Type here", "اكتب هنا"], optional: ["Optional", "اختياري"], required: ["This one is needed", "هذا الحقل مطلوب"],
  usedBefore: ["Used before. Tap to fill in:", "استُخدم سابقاً. اضغط للتعبئة:"],
  voiceTip: ["No need to type: tap the microphone on your keyboard and speak.", "لا حاجة للكتابة: اضغط الميكروفون في لوحة المفاتيح وتحدث."],
  me: ["Me", "أنا"], other: ["Other", "أخرى"], add: ["Add", "إضافة"], edit: ["Edit", "تعديل"], del: ["Delete", "حذف"], addEntry: ["Add entry", "إضافة سجل"],
  date: ["Date", "التاريخ"], time: ["Time", "الوقت"], note: ["Note", "ملاحظة"], whyNot: ["Why not? (short note)", "لماذا؟ (ملاحظة قصيرة)"],
  confirmSign: ["Confirm and complete", "تأكيد وإكمال"], allAnswered: ["All questions answered", "تمت الإجابة على جميع الأسئلة"],
  part: ["Your part", "الجزء الخاص بك"], waiting: ["Waiting for", "بانتظار"], takeOver: ["Take over this part", "استلام هذا الجزء"],
  localOnly: ["Not connected to the shared store data. What you enter is kept on this device only.", "غير متصل ببيانات المتجر المشتركة. ما تدخله يُحفظ على هذا الجهاز فقط."],
  readOnly: ["You can view, but your account cannot save. Ask the store manager to give you Contributor access.", "يمكنك العرض فقط. اطلب من مدير المتجر صلاحية المساهم."],
  nothingYet: ["Nothing here yet.", "لا يوجد شيء بعد."], entries: ["entries", "سجلات"], item: ["Item", "صنف"], addItem: ["Add item", "إضافة صنف"],
  pasteList: ["Paste a list", "لصق قائمة"], count: ["Count", "العدد"], system: ["System", "النظام"], lang: ["العربية", "English"],
  onDuty: ["Working this day", "يعمل هذا اليوم"], assignTo: ["Assigned to", "مسندة إلى"], nobody: ["Nobody yet", "لا أحد بعد"],
};
const T = k => (STR[k] ? STR[k][LANG === "ar" ? 1 : 0] : k);
const L = o => (o == null ? "" : typeof o === "string" ? o : (LANG === "ar" && o.ar) || o.en || "");
function setLang(l) { LANG = l; try { localStorage.setItem("sb-lang", l); } catch (e) {} document.documentElement.lang = l; document.documentElement.dir = l === "ar" ? "rtl" : "ltr"; }

/* ===================== roles ===================== */
const ROLES = {
  sm: { en: "Store Manager", ar: "مدير المتجر" }, dsm: { en: "Deputy Store Manager", ar: "نائب مدير المتجر" },
  sc: { en: "Stock Controller", ar: "مراقب المخزون" }, ss: { en: "Senior Sales", ar: "بائع أول" }, sa: { en: "Sales", ar: "مبيعات" },
};
const isMgrRole = r => r === "sm" || r === "dsm";

/* ===================== state + data layer ===================== */
const S = { mode: "loading", canWrite: true, cfg: null, recs: new Map(), plans: {}, audits: {}, binder: {}, reviews: {}, months: new Set(), ready: false };
let DB = null, DOWNLOADS = null;
const LS_KEY = "sb-local-v1";
const listeners = [];
function notify() { listeners.forEach(f => { try { f(); } catch (e) { console.error(e); } }); }

function lsLoad() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch (e) { return null; } }
function lsSave() {
  if (S.mode !== "local") return;
  try { localStorage.setItem(LS_KEY, JSON.stringify({ cfg: S.cfg, recs: [...S.recs.entries()], plans: S.plans, audits: S.audits, binder: S.binder, reviews: S.reviews })); } catch (e) {}
}
function writeFail(e) { console.error("write failed", e); if (e && e.code === "invalid_argument") { S.canWrite = false; } toast(LANG === "ar" ? "تعذّر الحفظ. حاول مرة أخرى." : "Could not save. Please try again."); notify(); }

async function dataInit() {
  let db = null;
  if (window.claude && typeof window.claude.use === "function") {
    try { db = await Promise.race([window.claude.use("db"), new Promise(r => setTimeout(() => r(null), 11000))]); } catch (e) { db = null; }
    try { DOWNLOADS = await Promise.race([window.claude.use("downloads"), new Promise(r => setTimeout(() => r(null), 4000))]); } catch (e) { DOWNLOADS = null; }
    try { const u = await Promise.race([window.claude.use("user"), new Promise(r => setTimeout(() => r(null), 4000))]); if (u) { const c = await u.can("data.write"); if (c === false) S.canWrite = false; } } catch (e) {}
  }
  if (!db && window.SB_FIREBASE && window.SB_FIREBASE.projectId && window.firebase) {      // the GitHub copy keeps its data in Firebase
    try { firebase.initializeApp(window.SB_FIREBASE); const fs = firebase.firestore(); const cl = d => JSON.parse(JSON.stringify(d));
      const wrap = r => ({ onSnapshot: (n, e) => r.onSnapshot(n, e), get: () => r.get(), set: d => r.set(cl(d)), update: d => r.set(cl(d), { merge: true }), delete: () => r.delete() });
      db = { doc: p => wrap(fs.doc(p)), collection: p => fs.collection(p) }; } catch (e) { console.error("firebase", e); db = null; }
  }
  if (!db) {
    S.mode = "local";
    const d = lsLoad();
    if (d) { S.cfg = d.cfg; S.recs = new Map(d.recs || []); S.plans = d.plans || {}; S.audits = d.audits || {}; S.binder = d.binder || {}; S.reviews = d.reviews || {}; }
    S.ready = true; notify(); return;
  }
  DB = db; S.mode = "cloud";
  const timer = setTimeout(() => { if (!S.ready) { S.slow = true; notify(); } }, 10000);

async function pinHash(id, pin) {
  const txt = `${id}:${pin}:sb`;
  try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt)); return [...new Uint8Array(b)].slice(0, 10).map(x => x.toString(16).padStart(2, "0")).join(""); }
  catch (e) { let h = 5381; for (const c of txt) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return "x" + h.toString(16); }
}

function schedDate(id, date) {              // the day this form falls due in the period that contains `date` (null = not scheduled)

  if (c.freq === "monthly") { const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); return `${date.slice(0, 8)}${pad2(Math.min(c.dom || 1, last))}`; }
  if (c.freq === "quarterly") { const m = Math.floor(d.getMonth() / 3) * 3; return `${d.getFullYear()}-${pad2(m + 1)}-${pad2(Math.min(c.dom || 1, 28))}`; }

}

  if (c.freq === "monthly") return [date.slice(0, 8) + "01", ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0))];
  if (c.freq === "quarterly") { const m = Math.floor(d.getMonth() / 3) * 3; return [ymd(new Date(d.getFullYear(), m, 1)), ymd(new Date(d.getFullYear(), m + 3, 0))]; }

}

}
const planOf = date => S.plans[date] || {};
const isOff = (date, sid) => !!(planOf(date).off && planOf(date).off[sid]);

  const w = cfgForm(id).who; if (!w) return "";
  if (staff(w)) return isOff(date, w) ? "" : w;
  const c = staffList().filter(s => s.role === w && !isOff(date, s.id)); return c.length ? c[0].id : "";
}
const GROUP_ROLE = { floor: "ss", cash: "dsm", stock: "sc", admin: "dsm", exit: "dsm" };
const roleWho = (role, date) => { const c = staffList().filter(s => s.role === role && !isOff(date, s.id)); return c.length ? c[0].id : ""; };

const groupLabel = (id, g) => { if (!FORMS[id].zones) return L(GROUPS[g]); const z = ((S.cfg && S.cfg.tryon) || {})[g] || [], n = z.filter(i => i && i.item).length, fam = (z.find(i => i && i.fam) || {}).fam; return `${fam || "Part " + g.slice(1)} (${n})`; };
function groupWho(id, g, date) { if (!FORMS[id].zones) return roleWho(GROUP_ROLE[g], date); const l = staffList().filter(s => (s.role === "ss" || s.role === "sa") && !isOff(date, s.id)); return l.length ? l[["z1", "z2", "z3"].indexOf(g) % l.length].id : ""; }
function groupsOf(id) { if (FORMS[id].zones) return ["z1", "z2", "z3"].filter(z => (((S.cfg && S.cfg.tryon) || {})[z] || []).some(i => i && i.item)); const seen = []; FORMS[id].items.forEach(it => { if (!seen.includes(it.g)) seen.push(it.g); }); return seen; }
function taskDone(id, date, group) {
  const f = FORMS[id], rid2 = runId(id, date), [a, b] = periodOf(id, date);
  if (f.kind === "check") { const r = S.recs.get(rid2); if (!r) return false; if (!group) return !!r.done; return f.items.filter(it => it.g === group).every(it => r.data.items && r.data.items[it.id]); }

function tasksFor(date) {
  const out = [], p = planOf(date), now = today(), hm = nowHM();

    const sd = schedDate(id, date); if (!sd) continue;
    const [, pe] = periodOf(id, date); if (date < sd || date > pe) continue;

      const who = "who" in ov ? ov.who : group ? (groupWho(id, group, date) || mainWho) : mainWho;

/* ---- print centre ---- */
function rangeOf(k) { const t = today(); if (k === "yesterday") return [addDays(t, -1), addDays(t, -1)]; if (k === "week") return [weekStart(t), addDays(weekStart(t), 6)]; if (k === "month") return [t.slice(0, 8) + "01", ymd(new Date(+t.slice(0, 4), +t.slice(5, 7), 0))]; if (k === "lastmonth") { const e = addDays(t.slice(0, 8) + "01", -1); return [e.slice(0, 8) + "01", e]; } return [t, t]; }
const PRINT_IDS = () => { const seen = new Set(), out = []; formsOn().forEach(id => { const k = FORMS[id].printAs || id; if (!seen.has(k)) { seen.add(k); out.push(id); } }); return out; };
const printTitle = id => (FORMS[id].printAs === "openclose" ? (LANG === "ar" ? "قائمة الافتتاح والإغلاق" : "Opening & Closing Checklist") : L(FORMS[id].title));
VIEWS.printing = () => {
  const k = R.rk || "today", [a, b] = R.rk === "custom" ? [R.from || today(), R.to || today()] : rangeOf(k);
  const rows = PRINT_IDS().map(id => ({ id, n: pagesFor(id, a, b).length }));
  const ready = rows.filter(r => r.n);
  return `<h1>${T("print")}</h1><div class="row">${[["today", T("today")], ["yesterday", LANG === "ar" ? "أمس" : "Yesterday"], ["week", LANG === "ar" ? "هذا الأسبوع" : "This week"], ["month", LANG === "ar" ? "هذا الشهر" : "This month"], ["lastmonth", LANG === "ar" ? "الشهر الماضي" : "Last month"], ["custom", LANG === "ar" ? "تواريخ أخرى" : "Other dates"]].map(([v, l]) => `<button class="chip ${k === v ? "acc" : ""}" data-rk="${v}" style="border:0;padding:9px 14px;font-size:.9rem">${l}</button>`).join("")}</div>
    ${k === "custom" ? `<div class="row"><input class="in" type="date" id="prFrom" value="${a}" style="width:auto"><span>→</span><input class="in" type="date" id="prTo" value="${b}" style="width:auto"></div>` : `<p class="muted small num">${fmtD(a)}${a !== b ? " → " + fmtD(b) : ""}</p>`}
    <button class="btn" id="prAll" ${ready.length ? "" : "disabled"}>${LANG === "ar" ? "ملف PDF واحد لكل ما هو جاهز" : "One PDF with everything that is ready"} (${ready.reduce((s, r) => s + r.n, 0)} ${LANG === "ar" ? "صفحة" : "pages"})</button>
    <div class="list">${rows.map(r => `<div class="row"><span class="chip acc">${esc(FORMS[r.id].letter)}</span><span class="grow"><b>${esc(printTitle(r.id))}</b><div class="small muted num">${r.n ? `${r.n} ${LANG === "ar" ? "صفحة" : r.n === 1 ? "page" : "pages"}` : (LANG === "ar" ? "لا توجد بيانات في هذه الفترة" : "nothing filled in for these dates")}</div></span>
      ${r.n ? `<button class="btn sm" data-pv="${r.id}">${LANG === "ar" ? "عرض" : "View"}</button>` : ""}<button class="btn sm alt" data-blank="${r.id}">${LANG === "ar" ? "فارغ" : "Blank"}</button></div>`).join("")}</div>
    <div class="sec"><h2>${LANG === "ar" ? "غلاف وفهرس الملف" : "Binder cover and index"}</h2></div><div class="row"><button class="btn alt grow" data-static="cover">${LANG === "ar" ? "الغلاف" : "Cover page"}</button><button class="btn alt grow" data-static="index">${LANG === "ar" ? "الفهرس" : "Table of contents"}</button></div>`;
};
HOOKS.printing = app => {

  const f1 = $("#prFrom", app), t1 = $("#prTo", app); if (f1) { f1.onchange = async () => { R.from = f1.value; await loadMonth(ymOf(R.from)); render(); }; t1.onchange = () => { R.to = t1.value; render(); }; }
  app.querySelectorAll("[data-pv]").forEach(x => x.onclick = () => preview(x.dataset.pv, a, b));
  app.querySelectorAll("[data-blank]").forEach(x => x.onclick = () => preview(x.dataset.blank, a, b, true));
  app.querySelectorAll("[data-static]").forEach(x => x.onclick = () => showPages(SHEETS[x.dataset.static](), x.dataset.static));

function preview(id, a, b, blank) { const pages = pagesFor(id, a, b, blank); if (!pages.length) return toast(T("nothingYet")); showPages(pages, `${FORMS[id].printAs || id}${blank ? "_blank" : "_" + a + (a !== b ? "_" + b : "")}`); }
async function showPages(pages, name) {
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="sheet" style="max-height:96%"><div class="row"><h2 class="grow num">${pages.length} ${LANG === "ar" ? "صفحة" : pages.length === 1 ? "page" : "pages"}</h2><button class="pill" id="pvX">✕</button></div>
    <button class="btn" id="pvSave">${LANG === "ar" ? "حفظ كملف PDF للطباعة" : "Save as PDF to print"}</button><p class="small muted" id="pvMsg">${LANG === "ar" ? "اطبع الملف ثم وقّع بالقلم." : "Print the file, then sign by pen."}</p><div class="pages" id="pvPages"></div></div>`;
  document.body.appendChild(m);
  $("#pvX", m).onclick = () => m.remove();
  $("#pvSave", m).onclick = async () => { const btn = $("#pvSave", m); btn.disabled = true;
    try { const blob = await makePdf(pages, (i, n) => { $("#pvMsg", m).textContent = `${i} / ${n}`; }); $("#pvMsg", m).textContent = ""; await savePdf(blob, name + ".pdf"); } catch (e) { console.error(e); $("#pvMsg", m).textContent = (LANG === "ar" ? "تعذّر إنشاء الملف: " : "Could not build the PDF: ") + (e.message || e); }
    btn.disabled = false; };
  const box = $("#pvPages", m);
  for (const pg of pages.slice(0, 12)) { if (!m.isConnected) return; try { const cv = await renderPage(pg, 110); const im = new Image(); im.alt = "Form page"; im.src = cv.toDataURL("image/jpeg", 0.85); box.appendChild(im); } catch (e) { const p = document.createElement("p"); p.className = "banner"; p.textContent = String(e.message || e); box.appendChild(p); } }
  if (pages.length > 12) { const p = document.createElement("p"); p.className = "muted small"; p.textContent = LANG === "ar" ? `تُعرض أول 12 صفحة. الملف يحتوي كل الصفحات.` : `Showing the first 12 pages. The PDF has all ${pages.length}.`; box.appendChild(p); }
}

/* ---- binder check ---- */
function expectedDays(id, ym) {               // how many times a form should have been done in a month, up to today
  const c = cfgForm(id); if (c.on === false || c.freq === "event" || c.freq === "quarterly") return null;
  const last = new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate(), t = today(); let due = [], seen = new Set();
  for (let i = 1; i <= last; i++) { const d = `${ym}-${pad2(i)}`; if (d > t) break; if (d < ((S.cfg && S.cfg.liveFrom) || "")) continue; const sd = schedDate(id, d); if (sd === d && !seen.has(d)) { seen.add(d); due.push(d); } }
  return due;
}
VIEWS.binder = () => {
  const ym = R.ym || ymOf(today()), filed = (S.binder[ym] && S.binder[ym].filed) || {};
  const months = []; for (let i = 0, d = today().slice(0, 8) + "01"; i < 6; i++) { months.push(ymOf(d)); d = addDays(d, -1).slice(0, 8) + "01"; }
  const a = ym + "-01", b = ym + "-31";
  const rows = BINDER.map(([letter, title, ids]) => {
    let n = 0, miss = [], exp = 0;
    ids.forEach(id => { if (cfgForm(id).on === false) return; n += recsOf(id, a, b).length; const due = expectedDays(id, ym); if (due) { exp += due.length; due.forEach(d => { if (!taskDone(id, d, null)) miss.push(`${+d.slice(8)}`); }); } });
    const uniq = [...new Set(miss)];
    return { letter, title, ids, n, exp, miss: uniq, f: filed[letter] };
  });
  const ok = rows.filter(r => r.f).length;
  return `<div class="sec"><h1>${T("binder")}</h1><select class="in" id="bdYm" style="width:auto">${months.map(m => `<option value="${m}" ${m === ym ? "selected" : ""}>${monthLabel(m)}</option>`).join("")}</select></div>
    <p class="muted">${LANG === "ar" ? "لكل حرف في الفهرس: ما تم تعبئته، ما ينقص، وهل طُبع وحُفظ في الملف." : "For each letter in the table of contents: what is filled in, what is missing, and whether it is printed and filed."}</p>
    <div class="kpis"><div class="kpi"><b class="num">${ok}/${rows.length}</b><span>${LANG === "ar" ? "مطبوع ومحفوظ" : "printed and filed"}</span></div><div class="kpi"><b class="num">${rows.reduce((s, r) => s + r.n, 0)}</b><span>${T("entries")}</span></div><div class="kpi"><b class="num" style="color:${rows.some(r => r.miss.length) ? "var(--bad)" : "inherit"}">${rows.reduce((s, r) => s + r.miss.length, 0)}</b><span>${LANG === "ar" ? "أيام ناقصة" : "missing days"}</span></div></div>
    <div class="list">${rows.map(r => `<div class="stack" style="gap:8px"><div class="row"><span class="chip acc">${r.letter}</span><b class="grow">${esc(r.title)}</b>${r.miss.length ? `<span class="chip bad num">${r.miss.length} ${LANG === "ar" ? "ناقص" : "missing"}</span>` : r.exp ? `<span class="chip ok">${LANG === "ar" ? "مكتمل" : "complete"}</span>` : `<span class="chip num">${r.n}</span>`}</div>
      ${r.miss.length ? `<div class="small muted">${LANG === "ar" ? "أيام ناقصة:" : "Missing on day:"} <span class="num">${r.miss.slice(0, 31).join(", ")}</span></div>` : ""}
      <div class="row"><label class="row grow" style="gap:8px"><input type="checkbox" data-filed="${r.letter}" ${r.f ? "checked" : ""} style="width:22px;height:22px"><span>${LANG === "ar" ? "مطبوع وموقّع ومحفوظ في الملف" : "Printed, signed and filed"}${r.f ? ` <span class="muted small">· ${esc(shortName(r.f.by))} ${fmtD(ymd(new Date(r.f.at)))}</span>` : ""}</span></label>${r.ids.length ? `<button class="btn sm alt" data-bpv="${r.ids[0]}">${T("print")}</button>` : ""}</div></div>`).join("")}</div>`;
};
HOOKS.binder = app => {
  const ym = R.ym || ymOf(today());
  $("#bdYm", app).onchange = async e => { R.ym = e.target.value; await loadMonth(R.ym); render(); };
  app.querySelectorAll("[data-filed]").forEach(c => c.onchange = () => { const doc = clone(S.binder[ym] || { filed: {} }); doc.filed = doc.filed || {}; if (c.checked) doc.filed[c.dataset.filed] = { by: ME, at: Date.now() }; else delete doc.filed[c.dataset.filed]; Data.saveDoc("binder", ym, doc); });

/* ---- weekly review ---- */
VIEWS.review = () => {
  const ws = R.ws || weekStart(today()), we = addDays(ws, 6), id = "w" + ws, rv = S.reviews[id];
  let total = 0, done = 0; const gaps = [], issues = [];
  for (let d = ws; d <= we && d <= today(); d = addDays(d, 1)) if (d >= ((S.cfg && S.cfg.liveFrom) || "")) tasksFor(d).filter(t => !t.group && !t.carried).forEach(t => { total++; if (t.done) done++; else gaps.push(`${DOW[parseD(d).getDay()]} ${+d.slice(8)}: ${t.title}`); });
  [...S.recs.values()].filter(r => r.date >= ws && r.date <= we).forEach(r => {
    const f = FORMS[r.form]; if (!f) return;
    if (f.kind === "check") Object.entries((r.data && r.data.items) || {}).forEach(([k, a]) => { if (a.v === "n") issues.push(`${fmtD(r.date)} · ${L(f.title)}: ${L(f.items.find(i => i.id === k) || {}).slice(0, 70)}${a.note ? " (" + a.note + ")" : ""}`); });
    if (r.form === "stockcheck") { const n = (r.data.items || []).filter(it => { const fin = it.recount !== "" && it.recount != null ? it.recount : it.phy; return num(fin) !== null && num(it.sys) !== null && num(fin) !== num(it.sys); }).length; if (n) issues.push(`${fmtD(r.date)} · ${LANG === "ar" ? "فروقات جرد" : "Stock check differences"}: ${n}`); }
    if (r.form === "cashhandover" && r.data.remarks) issues.push(`${fmtD(r.date)} · ${LANG === "ar" ? "ملاحظة نقد" : "Cash remark"}: ${r.data.remarks}`);
    if (r.form === "refund" && r.data.onSystem === "n") issues.push(`${fmtD(r.date)} · ${LANG === "ar" ? "مرتجع غير منفذ على النظام" : "Refund not done on system"}: ${r.data.invoice}`);
    if (r.form === "incident") issues.push(`${fmtD(r.date)} · ${L(f.title)}`);
  });
  return `<div class="sec"><h1>${T("review")}</h1></div><div class="row"><button class="btn sm alt" id="rvPrev">←</button><b class="grow num" style="text-align:center">${fmtD(ws)} → ${fmtD(we)}</b><button class="btn sm alt" id="rvNext" ${addDays(ws, 7) > today() ? "disabled" : ""}>→</button></div>

const auditScore = ans => { let y = 0, n = 0, na = 0; for (let i = 1; i <= 31; i++) { const v = ans[i] && ans[i].v; if (v === "y") y++; else if (v === "n") n++; else if (v === "na") na++; } return { y, n, na, left: 31 - y - n - na, pct: y + n ? Math.round(y / (y + n) * 100) : null }; };
VIEWS.audit = () => {
  const E = auditEvidence(), runs = Object.entries(S.audits).map(([id, a]) => ({ id, ...a })).sort((a, b) => b.at - a.at), open = runs.find(r => !r.closed);
  const auto = {}; for (let i = 1; i <= 31; i++) if (E[i].s) auto[i] = { v: E[i].s }; const as = auditScore(auto);

  if (!open) {
    h += `<div class="card stack"><div class="row"><div class="grow"><div class="muted small">${LANG === "ar" ? "ما تثبته سجلات التطبيق الآن" : "What the app's records show right now"}</div><div class="score num">${as.pct === null ? "–" : as.pct + "%"}</div></div><div class="stack" style="gap:4px"><span class="chip ok num">${as.y} ${T("yes")}</span><span class="chip bad num">${as.n} ${T("no")}</span><span class="chip num">${as.left} ${LANG === "ar" ? "تُفحص في المتجر" : "to check in store"}</span></div></div>
      <p class="small muted">${LANG === "ar" ? "النتيجة = نعم ÷ (نعم + لا). لا ينطبق لا يُحسب. هكذا يحسب المدقق." : "Score = Yes ÷ (Yes + No). N/A is left out. This is how the auditor's report works it out."}</p><button class="btn" id="auStart">${LANG === "ar" ? "ابدأ زيارة تدقيق تجريبية" : "Start a practice audit visit"}</button></div>`;
    if (runs.length) h += `<div class="sec"><h2>${LANG === "ar" ? "الزيارات السابقة" : "Earlier practice visits"}</h2></div><div class="list">${runs.map(r => { const s = auditScore(r.ans || {}); return `<div class="row"><span class="grow"><b class="num">${fmtD(r.date)}</b><div class="small muted">${esc(shortName(r.by))} · ${s.y} ${T("yes")} · ${s.n} ${T("no")} · ${s.na} ${T("na")}</div></span><span class="chip ${s.pct >= 90 ? "ok" : s.pct >= 75 ? "warn" : "bad"} num" style="font-size:1rem">${s.pct === null ? "–" : s.pct + "%"}</span><button class="btn sm alt" data-aview="${esc(r.id)}">${LANG === "ar" ? "عرض" : "View"}</button></div>`; }).join("")}</div>`;
    h += `<div class="sec"><h2>${LANG === "ar" ? "أين تقف الآن" : "Where you stand now"}</h2></div><div class="list">${Array.from({ length: 31 }, (_, k) => k + 1).map(i => `<div class="row" style="align-items:flex-start"><span class="chip ${E[i].s === "y" ? "ok" : E[i].s === "n" ? "bad" : ""} num">Q${i}</span><span class="grow small">${esc(E[i].why)}</span></div>`).join("")}</div>`;
    return h;
  }
  const ans = open.ans || {}, sc = auditScore(ans);
  h += `<div class="card stack" style="position:sticky;top:64px;z-index:3"><div class="row"><div class="score num">${sc.pct === null ? "–" : sc.pct + "%"}</div><div class="grow stack" style="gap:6px"><div class="row" style="gap:6px"><span class="chip ok num">${sc.y} ${T("yes")}</span><span class="chip bad num">${sc.n} ${T("no")}</span><span class="chip num">${sc.na} ${T("na")}</span><span class="chip warn num">${sc.left} ${LANG === "ar" ? "متبقية" : "left"}</span></div><div class="bar"><i style="width:${Math.round((31 - sc.left) / 31 * 100)}%"></i></div></div></div></div>
    <div class="row"><button class="btn sm soft" id="auFill">${LANG === "ar" ? "استخدم ما يقترحه التطبيق" : "Use what the app suggests"}</button><button class="btn sm alt" id="auDrop">${LANG === "ar" ? "إلغاء هذه الزيارة" : "Discard this visit"}</button></div>`;
  AUDIT_SECTIONS.forEach(([name, a, b]) => { const part = {}; for (let i = a; i <= b; i++) part[i] = ans[i]; let y = 0, n = 0; for (let i = a; i <= b; i++) { if (ans[i] && ans[i].v === "y") y++; if (ans[i] && ans[i].v === "n") n++; }

    h += `</div>`; });

HOOKS.audit = app => {
  const runs = Object.entries(S.audits).map(([id, a]) => ({ id, ...a })).sort((a, b) => b.at - a.at), open = runs.find(r => !r.closed);
  const st = $("#auStart", app); if (st) st.onclick = () => { Data.saveDoc("audit", "a" + Date.now(), { date: today(), at: Date.now(), by: ME, ans: {}, closed: false }); };

    m.innerHTML = `<div class="sheet"><div class="row"><h2 class="grow num">${fmtD(r.date)} · ${s.pct === null ? "–" : s.pct + "%"}</h2><button class="pill" id="avX">✕</button></div><table class="t">${Array.from({ length: 31 }, (_, k) => k + 1).map(i => { const a = (r.ans || {})[i] || {}; return `<tr><th>Q${i}</th><td>${a.v === "y" ? "✓ Yes" : a.v === "n" ? "✕ No" : a.v === "na" ? "N/A" : "–"}</td><td class="small">${esc(a.c || "")}</td></tr>`; }).join("")}</table><button class="btn bad sm" id="avDel">${T("del")}</button></div>`;
    document.body.appendChild(m); $("#avX", m).onclick = () => m.remove(); $("#avDel", m).onclick = () => { m.remove(); Data.delDoc("audit", b.dataset.aview); }; });
  if (!open) return;
  const save = fn => { const doc = clone(S.audits[open.id]); delete doc.id; doc.ans = doc.ans || {}; fn(doc); Data.saveDoc("audit", open.id, doc); };
  app.querySelectorAll("[data-aq]").forEach(b => b.onclick = () => save(d => { const i = b.dataset.aq; d.ans[i] = Object.assign({}, d.ans[i], { v: d.ans[i] && d.ans[i].v === b.dataset.v ? "" : b.dataset.v }); }));
  app.querySelectorAll("[data-ac]").forEach(inp => inp.onchange = () => save(d => { const i = inp.dataset.ac; d.ans[i] = Object.assign({}, d.ans[i], { c: inp.value.trim() }); }));
  $("#auFill", app).onclick = () => { const E = auditEvidence(); save(d => { for (let i = 1; i <= 31; i++) if (E[i].s && !(d.ans[i] && d.ans[i].v)) d.ans[i] = Object.assign({}, d.ans[i], { v: E[i].s, c: (d.ans[i] && d.ans[i].c) || E[i].why }); }); };
  $("#auDrop", app).onclick = () => ask(LANG === "ar" ? "إلغاء هذه الزيارة؟" : "Discard this practice visit?", "", T("del"), () => Data.delDoc("audit", open.id), true);
  $("#auEnd", app).onclick = () => { save(d => { d.closed = true; d.closedAt = Date.now(); }); toast(T("saved")); window.scrollTo(0, 0); };
};
