<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Binder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a phone-first work tool. One column, big touch targets, status told by colour + shape. */
:root{
  --bg:#f4f4f2; --surface:#ffffff; --surface2:#ebebe8; --ink:#000000; --muted:#63635f; --line:#dcdcd7;
  --accent:#000000; --accent-ink:#ffffff; --accent-soft:#ebebe8;
  --ok:#17693a; --ok-soft:#e0f0e5; --warn:#8f5200; --warn-soft:#f8ead0; --bad:#b3261e; --bad-soft:#fae0dd;
  --font:"Archivo","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#000000; --surface:#141414; --surface2:#232323; --ink:#ffffff; --muted:#a3a39e; --line:#303030;
    --accent:#ffffff; --accent-ink:#000000; --accent-soft:#232323;
    --ok:#6bd494; --ok-soft:#12301f; --warn:#f0b35a; --warn-soft:#352810; --bad:#ff8a80; --bad-soft:#3d1c19;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --surface:#141414; --surface2:#232323; --ink:#ffffff; --muted:#a3a39e; --line:#303030;
  --accent:#ffffff; --accent-ink:#000000; --accent-soft:#232323;
  --ok:#6bd494; --ok-soft:#12301f; --warn:#f0b35a; --warn-soft:#352810; --bad:#ff8a80; --bad-soft:#3d1c19;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.5rem;font-weight:700} h2{font-size:1.15rem;font-weight:600} h3{font-size:1rem;font-weight:600}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
#app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:84px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.top .who{flex:1;min-width:0}
.top .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who span{color:var(--muted);font-size:.82rem}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem;min-height:40px}
main{padding:16px;display:flex;flex-direction:column;gap:16px;flex:1}
.banner{padding:10px 14px;border-radius:var(--r);font-size:.9rem;background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:.85rem}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:4px}
.sec span{color:var(--muted);font-size:.85rem}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:600;background:var(--accent);color:var(--accent-ink);min-height:52px}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:8px 12px;min-height:40px;font-size:.9rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.task{display:flex;gap:12px;align-items:center;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-inline-start:6px solid var(--line);border-radius:var(--r);padding:14px;min-height:64px}
.task.done{border-inline-start-color:var(--ok)} .task.late{border-inline-start-color:var(--bad)} .task.due{border-inline-start-color:var(--warn)}
.task b{display:block} .task small{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:start;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.tile .let{font-weight:700;color:var(--accent);font-size:.8rem;letter-spacing:.04em}
.tile b{font-weight:600;line-height:1.25}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi b{display:block;font-size:1.7rem;font-weight:700;line-height:1.1} .kpi span{color:var(--muted);font-size:.8rem}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs div{display:flex;width:100%;max-width:760px}
nav.tabs button{flex:1;border:0;background:none;padding:10px 2px 12px;font-size:.74rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:60px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
/* wizard */
.wiz{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.wiz header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.wiz header .t{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wiz .prog{height:6px;background:var(--surface2)} .wiz .prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.wiz .body{flex:1;overflow:auto;padding:22px 18px;display:flex;flex-direction:column;gap:18px;max-width:760px;width:100%;margin:0 auto}
.wiz .q{font-size:1.55rem;font-weight:600;line-height:1.25;text-wrap:balance}
.wiz .q.long{font-size:1.2rem}
.wiz .hint{color:var(--muted)}
.wiz footer{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);max-width:760px;width:100%;margin:0 auto}
.wiz footer .btn{flex:1}
.big{width:100%;font-size:1.35rem;padding:16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);min-height:64px}
textarea.big{min-height:190px;resize:vertical;line-height:1.4}
.big:focus{border-color:var(--accent);outline:0}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;font-size:1.15rem;font-weight:600;min-height:64px;text-align:center}
.opt.huge{font-size:1.6rem;min-height:120px}
.opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.opt.yes.on{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.no.on{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.85rem;font-weight:600;color:var(--muted)}
.in{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-height:46px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.list>*{padding:12px 14px;border-top:1px solid var(--line)} .list>*:first-child{border-top:0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto}
.pad button{font-size:1.5rem;font-weight:600;min-height:64px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.dots{display:flex;gap:12px;justify-content:center} .dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)} .dots i.on{background:var(--accent);border-color:var(--accent)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.days button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;min-width:64px;text-align:center}
.days button b{display:block;font-size:1.1rem} .days button span{font-size:.72rem;color:var(--muted)}
.days button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .days button.on span{color:var(--accent-ink)}
.pages{display:flex;flex-direction:column;gap:12px}
.pages img{max-width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:90%}
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--bg);width:100%;max-width:760px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:18px;display:flex;flex-direction:column;gap:12px}
.score{font-size:3rem;font-weight:700;line-height:1}
table.t{width:100%;border-collapse:collapse;font-size:.9rem} table.t td,table.t th{padding:8px 6px;border-top:1px solid var(--line);text-align:start;vertical-align:top} table.t th{color:var(--muted);font-weight:600;border-top:0}
.scroll{overflow-x:auto}
[dir="rtl"] .flip{transform:scaleX(-1)}
/* ---- On look: black and white, the black band at the top carries the logo ---- */
h1{font-size:1.7rem;font-weight:800;letter-spacing:-.025em} h2{font-size:1.2rem;font-weight:700;letter-spacing:-.015em} h3{font-weight:700}
.top{background:#000;color:#fff;border-bottom:1px solid #2a2a2a;padding:10px 16px;min-height:60px}
.logo{object-fit:contain}
.top .logo{width:auto;height:32px;flex:0 0 auto;display:block}
.qt{font-size:1.05rem;font-weight:700;line-height:1.35;letter-spacing:-.005em}
.top .who b{font-weight:700;letter-spacing:-.01em} .top .who span{color:#b9b9b4}
.top .pill{background:transparent;color:#fff;border-color:#5a5a5a}
.btn{border-radius:999px;font-weight:700;letter-spacing:-.005em}
.btn.alt{border:1.5px solid var(--ink)} .btn.soft{background:var(--surface);color:var(--ink);border:1.5px dashed var(--ink)}
.btn.sm{border-radius:999px;padding:8px 14px}
.btn.bad{border:1.5px solid var(--bad);background:var(--surface)}
.card,.kpi,.tile,.list,.task{box-shadow:0 1px 0 rgba(0,0,0,.04)}
.kpi b{font-weight:800;letter-spacing:-.03em;font-size:1.9rem}
.tile .let{color:var(--muted)}
.chip.acc{background:var(--ink);color:var(--bg)}
nav.tabs button{position:relative} nav.tabs button.on{color:var(--ink)} nav.tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--ink);border-radius:0 0 3px 3px}
.opt{border-radius:12px} .opt.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.wiz .q{font-weight:800;letter-spacing:-.02em}
.wiz header{background:#000;color:#fff;border-bottom:0} .wiz header .pill{background:transparent;color:#fff;border-color:#5a5a5a} .wiz header .chip{background:#fff;color:#000}
.wiz .prog{background:#2a2a2a;height:4px} .wiz .prog i{background:#fff}
.in{border-radius:8px} .in:focus,.big:focus{border-color:var(--ink);outline:2px solid var(--ink);outline-offset:0}
.days button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)} .days button.on span{color:var(--bg)}
.pad button{border-radius:50%;aspect-ratio:1;min-height:0;font-weight:700} .pad{max-width:280px;gap:14px}
.hero{background:#000;color:#fff;border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.hero{--ok:#6bd494;--bad:#ff8a80;--warn:#f0b35a;--ok-soft:#12301f;--warn-soft:#352810;--bad-soft:#3d1c19}
.hero .muted{color:#b9b9b4} .hero .score{font-size:4rem;font-weight:800;letter-spacing:-.04em}
.hero .chip{background:#2a2a2a;color:#fff}
.brand{display:flex;flex-direction:column;align-items:center;gap:14px;background:#000;color:#fff;border-radius:var(--r);padding:28px 18px;text-align:center}
.brand img{width:auto;height:58px} .brand b{font-size:1.5rem;font-weight:800;letter-spacing:-.025em} .brand span{color:#b9b9b4;font-size:.9rem}
summary{font-weight:700;cursor:pointer}
/* ranked bars: one ink series, value printed on every row, rounded only at the data end */
.bars{display:flex;flex-direction:column;gap:12px}
.br{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline}
.br .bl{font-weight:600;min-width:0;overflow-wrap:anywhere} .br .bv{font-weight:700;white-space:nowrap}
.br .bt{grid-column:1 / -1;position:relative;height:8px;background:var(--surface2);border-radius:4px}
.br .bt i{display:block;height:100%;background:var(--ink);border-start-end-radius:4px;border-end-end-radius:4px;min-width:2px}
.br .bt b{position:absolute;top:-4px;width:2px;height:16px;background:var(--muted);box-shadow:0 0 0 2px var(--surface)}
@media (max-width:400px){.kpis{grid-template-columns:1fr 1fr 1fr}.wiz .q{font-size:1.35rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>

"use strict";
/* ===================== helpers ===================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad2 = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const today = () => ymd(new Date());
const nowHM = () => { const d = new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const ymOf = s => s.slice(0, 7);
const MON = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const DOW_AR = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
const fmtD = s => { if (!s) return ""; const [y, m, d] = s.split("-"); return `${d}.${m}.${y}`; };       // printed on forms
const monthLabel = ym => { const [y, m] = ym.split("-"); return `${MON[+m - 1]} ${y}`; };
const weekStart = s => addDays(s, -parseD(s).getDay());                                                  // Sunday
const weekOfMonth = s => Math.min(5, Math.ceil(+s.slice(8, 10) / 7));
const quarterOf = s => `${s.slice(0, 4)}-Q${Math.floor((+s.slice(5, 7) - 1) / 3) + 1}`;
const rid = () => Math.random().toString(36).slice(2, 10);
const num = v => { const n = parseFloat(String(v ?? "").replace(/,/g, "")); return isFinite(n) ? n : null; };
const money = v => { const n = num(v); return n === null ? String(v ?? "") : n.toLocaleString("en-US", { maximumFractionDigits: 2 }); };
const clone = o => JSON.parse(JSON.stringify(o));
function deepMerge(a, b) {
  for (const k of Object.keys(b)) {
    if (b[k] && typeof b[k] === "object" && !Array.isArray(b[k]) && a[k] && typeof a[k] === "object" && !Array.isArray(a[k])) deepMerge(a[k], b[k]);
    else a[k] = b[k];
  }
  return a;
}

/* ===================== language ===================== */
let LANG = "en";
try { LANG = localStorage.getItem("sb-lang") || "en"; } catch (e) {}
const STR = {
  appName: ["Store Binder", "ملف المتجر"],
  loading: ["Loading…", "جارٍ التحميل…"],

  newPin: ["Now choose your own 4-digit PIN", "اختر رقماً سرياً من 4 أرقام"],
  repeatPin: ["Type it again", "أعد كتابته"],

  wrongPin: ["Wrong PIN. Try again.", "الرقم السري خطأ. حاول مرة أخرى."],
  back: ["Back", "رجوع"], next: ["Next", "التالي"], skip: ["Skip", "تخطي"], save: ["Save", "حفظ"], finish: ["Finish", "إنهاء"],
  cancel: ["Cancel", "إلغاء"], close: ["Close", "إغلاق"], yes: ["Yes", "نعم"], no: ["No", "لا"], na: ["N/A", "لا ينطبق"],
  done: ["Done", "تم"], notDone: ["Not done", "لم يتم"], late: ["Late", "متأخر"], dueBy: ["Due by", "قبل"], open: ["Open", "مفتوح"],
  myTasks: ["My tasks today", "مهامي اليوم"], openTasks: ["Not assigned to anyone", "غير مسندة لأحد"], noTasks: ["Nothing assigned to you today.", "لا توجد مهام مسندة لك اليوم."],
  logSomething: ["Something happened? Log it", "حدث شيء؟ سجّله"], allForms: ["All forms", "كل النماذج"],
  home: ["Home", "الرئيسية"], forms: ["Forms", "النماذج"], records: ["Records", "السجلات"], today: ["Today", "اليوم"], plan: ["Plan", "الخطة"],
  print: ["Print", "طباعة"], more: ["More", "المزيد"], binder: ["Binder check", "فحص الملف"], review: ["Weekly review", "المراجعة الأسبوعية"],
  audit: ["Audit simulator", "محاكي التدقيق"], config: ["Settings", "الإعدادات"], signOut: ["Sign out", "تسجيل الخروج"],
  viewAs: ["View as a team member", "العرض كأحد أعضاء الفريق"], backToMe: ["Back to my view", "العودة إلى حسابي"],
  saved: ["Saved", "تم الحفظ"], typeHere: ["Type here", "اكتب هنا"], optional: ["Optional", "اختياري"], required: ["This one is needed", "هذا الحقل مطلوب"],
  usedBefore: ["Used before. Tap to fill in:", "استُخدم سابقاً. اضغط للتعبئة:"],
  voiceTip: ["No need to type: tap the microphone on your keyboard and speak.", "لا حاجة للكتابة: اضغط الميكروفون في لوحة المفاتيح وتحدث."],
  me: ["Me", "أنا"], other: ["Other", "أخرى"], add: ["Add", "إضافة"], edit: ["Edit", "تعديل"], del: ["Delete", "حذف"], addEntry: ["Add entry", "إضافة سجل"],
  date: ["Date", "التاريخ"], time: ["Time", "الوقت"], note: ["Note", "ملاحظة"], whyNot: ["Why not? (short note)", "لماذا؟ (ملاحظة قصيرة)"],
  confirmSign: ["Confirm and complete", "تأكيد وإكمال"], allAnswered: ["All questions answered", "تمت الإجابة على جميع الأسئلة"],
  part: ["Your part", "الجزء الخاص بك"], waiting: ["Waiting for", "بانتظار"], takeOver: ["Take over this part", "استلام هذا الجزء"],

async function dataInit() {

    try { firebase.initializeApp(window.SB_FIREBASE); const fs = firebase.firestore(); const cl = d => JSON.parse(JSON.stringify(d));
      const wrap = r => ({ onSnapshot: (n, e) => r.onSnapshot(n, e), get: () => r.get(), set: d => r.set(cl(d)), update: d => r.set(cl(d), { merge: true }), delete: () => r.delete() });

  db.collection("binder").onSnapshot(q => { S.binder = {}; q.docs.forEach(d => { S.binder[d.id] = clone(d.data()); }); notify(); }, onErr);

async function pinHash(id, pin) {
  const txt = `${id}:${pin}:sb`;
  try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt)); return [...new Uint8Array(b)].slice(0, 10).map(x => x.toString(16).padStart(2, "0")).join(""); }

}

    <div class="dots" aria-label="PIN">${[0, 1, 2, 3].map(i => `<i class="${i < LG.pin.length ? "on" : ""}"></i>`).join("")}</div><p class="small" style="color:var(--bad);min-height:1.4em" id="lgMsg">${esc(LG.msg || "")}</p>
    <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, "", 0, "⌫"].map(k => k === "" ? "<span></span>" : `<button data-k="${k}">${k}</button>`).join("")}</div></div></main>`;
  $("#lgBack", app).onclick = () => { LG = { id: null }; render(); };
  app.querySelectorAll("[data-k]").forEach(b => b.onclick = async () => {
    const k = b.dataset.k; LG.msg = "";
    if (k === "⌫") LG.pin = LG.pin.slice(0, -1); else if (LG.pin.length < 4) LG.pin += k;
    if (LG.pin.length === 4) {

    }
    render();
  });
}

function recSummary(r) {
  const f = FORMS[r.form]; if (!f) return "";
  if (f.kind === "check") { const a = Object.values((r.data && r.data.items) || {}); return `${a.filter(x => x.v === "y").length}/${f.items.length} ✓` + (r.done ? "" : " · " + T("open")); }
  const d = r.data || {}; const bits = [];
  for (const fd of fieldsOf(f)) { const v = d[fd.k]; if (v === "" || v == null || fd.t === "rows" || fd.t === "long") continue; bits.push(fd.t === "staff" ? shortName(v) : Array.isArray(v) ? v.length : fd.t === "yesno" ? (v === "y" ? "Yes" : "No") : fd.t === "choice" ? L((optsFromStatic(fd, d).find(x => x.v === v)) || { en: v }) : v); if (bits.length >= 3) break; }
  if (d.items) bits.push(`${d.items.length} ${T("entries")}`);
  return bits.join(" · ");
}
const optsFromStatic = (fd, d) => (fd.optsFrom ? fd.optsFrom(d) : fd.opts || []);

};

function recDetail(id) {
  const r = S.recs.get(id); if (!r) return; const f = FORMS[r.form], d = r.data || {}; let rows = "";

  else rows = fieldsOf(f).map(fd => { const v = d[fd.k]; let s = ""; if (fd.t === "rows") s = (v || []).map((x, i) => `${i + 1}. ${Object.values(x).map(y => staff(y) ? shortName(y) : y).filter(y => y !== "" && y != null).join(" · ")}`).join("<br>"); else if (fd.t === "staff") s = esc(nameId(v)); else if (Array.isArray(v)) s = esc(v.map(x => staff(x) ? shortName(x) : L(optsFromStatic(fd, d).find(z => z.v === x) || { en: x })).join(", ")); else if (fd.t === "yesno") s = v === "y" ? T("yes") : v === "n" ? T("no") : ""; else if (fd.t === "choice") s = esc(L(optsFromStatic(fd, d).find(z => z.v === v) || { en: v || "" })); else s = esc(v ?? ""); return `<tr><th>${esc(L(fd.q))}</th><td>${s}</td></tr>`; }).join("");

  const dl = $("#rdDel", m); if (dl) dl.onclick = () => { m.remove(); ask(T("del") + "?", L(f.title) + " · " + fmtD(r.date), T("del"), () => { Data.delRec(id); toast(T("done")); }, true); };
}

function rangeOf(k) { const t = today(); if (k === "yesterday") return [addDays(t, -1), addDays(t, -1)]; if (k === "week") return [weekStart(t), addDays(weekStart(t), 6)]; if (k === "month") return [t.slice(0, 8) + "01", ymd(new Date(+t.slice(0, 4), +t.slice(5, 7), 0))]; if (k === "lastmonth") { const e = addDays(t.slice(0, 8) + "01", -1); return [e.slice(0, 8) + "01", e]; } return [t, t]; }

function expectedDays(id, ym) {               // how many times a form should have been done in a month, up to today
  const c = cfgForm(id); if (c.on === false || c.freq === "event" || c.freq === "quarterly") return null;
  const last = new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate(), t = today(); let due = [], seen = new Set();
  for (let i = 1; i <= last; i++) { const d = `${ym}-${pad2(i)}`; if (d > t) break; if (d < ((S.cfg && S.cfg.liveFrom) || "")) continue; const sd = schedDate(id, d); if (sd === d && !seen.has(d)) { seen.add(d); due.push(d); } }
  return due;
}

VIEWS.review = () => {
  const ws = R.ws || weekStart(today()), we = addDays(ws, 6), id = "w" + ws, rv = S.reviews[id];
  let total = 0, done = 0; const gaps = [], issues = [];
  for (let d = ws; d <= we && d <= today(); d = addDays(d, 1)) if (d >= ((S.cfg && S.cfg.liveFrom) || "")) tasksFor(d).filter(t => !t.group && !t.carried).forEach(t => { total++; if (t.done) done++; else gaps.push(`${DOW[parseD(d).getDay()]} ${+d.slice(8)}: ${t.title}`); });
  [...S.recs.values()].filter(r => r.date >= ws && r.date <= we).forEach(r => {
    const f = FORMS[r.form]; if (!f) return;
    if (f.kind === "check") Object.entries((r.data && r.data.items) || {}).forEach(([k, a]) => { if (a.v === "n") issues.push(`${fmtD(r.date)} · ${L(f.title)}: ${L(f.items.find(i => i.id === k) || {}).slice(0, 70)}${a.note ? " (" + a.note + ")" : ""}`); });
    if (r.form === "stockcheck") { const n = (r.data.items || []).filter(it => { const fin = it.recount !== "" && it.recount != null ? it.recount : it.phy; return num(fin) !== null && num(it.sys) !== null && num(fin) !== num(it.sys); }).length; if (n) issues.push(`${fmtD(r.date)} · ${LANG === "ar" ? "فروقات جرد" : "Stock check differences"}: ${n}`); }
    if (r.form === "cashhandover" && r.data.remarks) issues.push(`${fmtD(r.date)} · ${LANG === "ar" ? "ملاحظة نقد" : "Cash remark"}: ${r.data.remarks}`);
    if (r.form === "refund" && r.data.onSystem === "n") issues.push(`${fmtD(r.date)} · ${LANG === "ar" ? "مرتجع غير منفذ على النظام" : "Refund not done on system"}: ${r.data.invoice}`);
    if (r.form === "incident") issues.push(`${fmtD(r.date)} · ${L(f.title)}`);
  });
  return `<div class="sec"><h1>${T("review")}</h1></div><div class="row"><button class="btn sm alt" id="rvPrev">←</button><b class="grow num" style="text-align:center">${fmtD(ws)} → ${fmtD(we)}</b><button class="btn sm alt" id="rvNext" ${addDays(ws, 7) > today() ? "disabled" : ""}>→</button></div>
    <div class="kpis"><div class="kpi"><b class="num">${total ? Math.round(done / total * 100) : 0}%</b><span>${LANG === "ar" ? "مهام مكتملة" : "tasks completed"}</span></div><div class="kpi"><b class="num" style="color:${gaps.length ? "var(--bad)" : "inherit"}">${gaps.length}</b><span>${LANG === "ar" ? "لم تُنجز" : "not done"}</span></div><div class="kpi"><b class="num" style="color:${issues.length ? "var(--warn)" : "inherit"}">${issues.length}</b><span>${LANG === "ar" ? "نقاط للمتابعة" : "points to follow up"}</span></div></div>
    <div class="card stack"><h3>${LANG === "ar" ? "لم تُنجز" : "Not done"}</h3>${gaps.map(g => `<div class="small">✕ ${esc(g)}</div>`).join("") || `<div class="small muted">${LANG === "ar" ? "لا شيء. كل المهام منجزة." : "Nothing. Every task was done."}</div>`}</div>
    <div class="card stack"><h3>${LANG === "ar" ? "نقاط للمتابعة" : "Points to follow up"}</h3>${issues.map(g => `<div class="small">• ${esc(g)}</div>`).join("") || `<div class="small muted">${LANG === "ar" ? "لا توجد نقاط." : "Nothing flagged."}</div>`}</div>
    ${rv ? `<div class="card row"><span class="chip ok">✓</span><span class="grow">${LANG === "ar" ? "تمت المراجعة بواسطة" : "Reviewed by"} <b>${esc(shortName(rv.by))}</b> · <span class="num">${fmtD(ymd(new Date(rv.at)))}</span>${rv.note ? `<div class="small muted">${esc(rv.note)}</div>` : ""}</span><button class="btn sm alt" id="rvUndo">${LANG === "ar" ? "تراجع" : "Undo"}</button></div>` :
      `<div class="field"><label for="rvNote">${T("note")} (${T("optional")})</label><textarea class="in" id="rvNote" rows="3"></textarea></div><button class="btn" id="rvOk">${LANG === "ar" ? "أؤكد أنني راجعت هذا الأسبوع" : "I have reviewed this week"}</button>`}`;

const auditScore = ans => { let y = 0, n = 0, na = 0; for (let i = 1; i <= 31; i++) { const v = ans[i] && ans[i].v; if (v === "y") y++; else if (v === "n") n++; else if (v === "na") na++; } return { y, n, na, left: 31 - y - n - na, pct: y + n ? Math.round(y / (y + n) * 100) : null }; };

      <p class="small muted">${LANG === "ar" ? "النتيجة = نعم ÷ (نعم + لا). لا ينطبق لا يُحسب. هكذا يحسب المدقق." : "Score = Yes ÷ (Yes + No). N/A is left out. This is how the auditor's report works it out."}</p><button class="btn" id="auStart">${LANG === "ar" ? "ابدأ زيارة تدقيق تجريبية" : "Start a practice audit visit"}</button></div>`;

HOOKS.audit = app => {
